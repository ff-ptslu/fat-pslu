<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulir Permohonan Dana</title>
<link rel="icon" href="logo.png">
<style>
/* Formulir cetak. Ukuran dan tata letaknya mengikuti formulir yang
   sudah dipakai, agar orang yang menandatangani tidak perlu menyesuaikan diri. */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px; color: #000; background: #E9E9EC;
  padding: 24px 12px 60px;
}

.kertas {
  width: 210mm; min-height: 148mm; margin: 0 auto; padding: 10mm;
  background: #fff; border: 1px solid #ccc;
}

.judul { font-size: 19px; font-weight: bold; letter-spacing: -.2px; }
.merek { width: 54px; height: auto; }

table.isi { width: 100%; border-collapse: collapse; }
table.isi td { padding: 1px 0; vertical-align: top; }
.lb { width: 130px; }
.ttk { width: 12px; }

.kotak { border: 1.5px solid #000; padding: 6px 8px; margin-top: 6px; }
.kotak-judul { font-size: 13px; font-weight: bold; }

.cb {
  display: inline-block; width: 16px; height: 14px; border: 1.5px solid #000;
  text-align: center; font-weight: bold; line-height: 12px; margin-right: 5px;
  vertical-align: -2px;
}
.pilihan { display: inline-block; margin-right: 18px; white-space: nowrap; }
.miring { font-style: italic; }

.garis { border-bottom: 1px solid #000; display: inline-block; min-width: 90px; }
.isian { border-bottom: 1px solid #000; padding-bottom: 1px; }

.merah { color: #C00000; font-weight: bold; }
.biru { color: #0033CC; font-weight: bold; }
.biru a { color: #0033CC; }

.pusat { text-align: center; font-weight: bold; }
.kanan { text-align: right; }
.kecil { font-size: 10px; }
.mono { font-family: 'Courier New', monospace; }

.tanda { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1.5px solid #000; margin-top: 6px; }
.tanda > div { border-right: 1.5px solid #000; padding: 5px 7px; min-height: 62px; }
.tanda > div:last-child { border-right: 0; }
.tanda .kepala { text-align: center; font-weight: bold; border-bottom: 1.5px solid #000;
  margin: -5px -7px 5px; padding: 3px; }

.bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: #17356B; color: #fff;
  padding: 10px 16px; display: flex; gap: 10px; align-items: center;
  font-family: system-ui, sans-serif; font-size: 13px;
}
.bar button {
  font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px;
  border: 0; border-radius: 7px; cursor: pointer; background: #fff; color: #17356B;
}
.bar .ghost { background: rgba(255,255,255,.16); color: #fff; }
.bar .info { margin-left: auto; opacity: .85; }

.memuat { text-align: center; padding: 60px; color: #666; font-family: system-ui, sans-serif; }

@media print {
  body { background: #fff; padding: 0; }
  .kertas { width: auto; border: 0; margin: 0; padding: 0; }
  .bar { display: none; }
  @page { size: A4 landscape; margin: 10mm; }
}
</style>
</head>
<body>

<div id="wadah"><div class="memuat">Memuat formulir…</div></div>

<div class="bar" id="bar" hidden>
  <button onclick="cetak()">Cetak</button>
  <button class="ghost" onclick="window.close()">Tutup</button>
  <span class="info" id="info"></span>
</div>

<script src="api.js"></script>
<script src="cetak.js"></script>
</body>
</html>
